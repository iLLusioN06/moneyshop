# ============================================
# MoneyShop — Production Docker Compose
# ============================================
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Required env vars (set in .env.production):
#   DATABASE_URL, NEXTAUTH_SECRET, JWT_SECRET,
#   CARD_ENCRYPTION_KEY, VAPID_PRIVATE_KEY, etc.
# ============================================

services:
  # ─── Nginx Reverse Proxy ─────────────────────
  nginx:
    image: nginx:alpine
    container_name: moneyshop-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
      - ws
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── Redis ───────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: moneyshop-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  # ─── Next.js App ─────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: moneyshop-app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      AUTH_SECRET: "${NEXTAUTH_SECRET}"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET}"
      NEXTAUTH_URL: "${APP_URL:-https://moneyshop.iq}"
      AUTH_URL: "${APP_URL:-https://moneyshop.iq}"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_EXPIRES_IN: "7d"
      APP_URL: "${APP_URL:-https://moneyshop.iq}"
      NEXT_PUBLIC_APP_URL: "${APP_URL:-https://moneyshop.iq}"
      NEXT_PUBLIC_APP_NAME: "MoneyShop"
      CORS_ORIGIN: "${APP_URL:-https://moneyshop.iq}"
      NODE_ENV: "production"
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      REDIS_URL: "redis://redis:6379"
      NEXT_PUBLIC_WS_URL: "${WS_URL:-ws://moneyshop.iq}"
      CARD_ENCRYPTION_KEY: "${CARD_ENCRYPTION_KEY}"
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN}"
      TWILIO_PHONE_NUMBER: "${TWILIO_PHONE_NUMBER}"
      RESEND_API_KEY: "${RESEND_API_KEY}"
      EMAIL_FROM: "${EMAIL_FROM:-noreply@moneyshop.iq}"
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: "${NEXT_PUBLIC_VAPID_PUBLIC_KEY}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY}"
      VAPID_SUBJECT: "${VAPID_SUBJECT:-mailto:noreply@moneyshop.iq}"
      NEXT_PUBLIC_SENTRY_DSN: "${NEXT_PUBLIC_SENTRY_DSN:-}"
      AUTO_UPDATE_ENABLED: "${AUTO_UPDATE_ENABLED:-true}"
      GITHUB_OWNER: "${GITHUB_OWNER}"
      GITHUB_REPO: "${GITHUB_REPO}"
      GITHUB_TOKEN: "${GITHUB_TOKEN}"
    depends_on:
      redis:
        condition: service_healthy

  # ─── WebSocket Server ────────────────────────
  ws:
    build:
      context: .
      dockerfile: Dockerfile
      target: ws-server
    container_name: moneyshop-ws
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      REDIS_URL: "redis://redis:6379"
      CORS_ORIGIN: "${APP_URL:-https://moneyshop.iq}"
      WS_PORT: "3001"
      HOSTNAME: "0.0.0.0"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
