# ============================================
# MoneyShop — Docker Compose (Base)
# ============================================
# Base configuration shared across environments.
# Production: docker compose -f docker-compose.prod.yml up -d
# Development: docker compose up -d (includes override)
# ============================================

services:
  redis:
    image: redis:7-alpine
    container_name: moneyshop-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: moneyshop-app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      AUTH_SECRET: "${NEXTAUTH_SECRET}"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET}"
      NEXTAUTH_URL: "${APP_URL:-http://localhost:3000}"
      AUTH_URL: "${APP_URL:-http://localhost:3000}"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_EXPIRES_IN: "7d"
      APP_URL: "${APP_URL:-http://localhost:3000}"
      NEXT_PUBLIC_APP_URL: "${APP_URL:-http://localhost:3000}"
      NEXT_PUBLIC_APP_NAME: "MoneyShop"
      CORS_ORIGIN: "${APP_URL:-http://localhost:3000}"
      NODE_ENV: "production"
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      REDIS_URL: "redis://redis:6379"
      NEXT_PUBLIC_WS_URL: "${WS_URL:-http://localhost:3001}"
      CARD_ENCRYPTION_KEY: "${CARD_ENCRYPTION_KEY}"
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN}"
      TWILIO_PHONE_NUMBER: "${TWILIO_PHONE_NUMBER}"
      RESEND_API_KEY: "${RESEND_API_KEY}"
      EMAIL_FROM: "${EMAIL_FROM:-noreply@moneyshop.iq}"
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: "${NEXT_PUBLIC_VAPID_PUBLIC_KEY}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY}"
      VAPID_SUBJECT: "${VAPID_SUBJECT:-mailto:noreply@moneyshop.iq}"
      NEXT_PUBLIC_SENTRY_DSN: "${NEXT_PUBLIC_SENTRY_DSN:-}"
      AUTO_UPDATE_ENABLED: "${AUTO_UPDATE_ENABLED:-true}"
      GITHUB_OWNER: "${GITHUB_OWNER}"
      GITHUB_REPO: "${GITHUB_REPO}"
      GITHUB_TOKEN: "${GITHUB_TOKEN}"
    depends_on:
      redis:
        condition: service_healthy

  ws:
    build:
      context: .
      dockerfile: Dockerfile
      target: ws-server
    container_name: moneyshop-ws
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      REDIS_URL: "redis://redis:6379"
      CORS_ORIGIN: "${APP_URL:-http://localhost:3000}"
      WS_PORT: "3001"
      HOSTNAME: "0.0.0.0"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
