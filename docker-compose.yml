# ============================================
# MoneyShop — Production Docker Compose
# ============================================
# Usage:
#   docker compose up -d
#
# Required env vars (set in .env or shell):
#   DATABASE_URL   - Neon PostgreSQL connection string
#   NEXTAUTH_SECRET- Random secret for NextAuth
#   JWT_SECRET     - Random secret for JWT
#   CARD_ENCRYPTION_KEY - AES-256 key for card encryption
#   VAPID_PRIVATE_KEY   - Web Push private key
# ============================================

services:
  redis:
    image: redis:7-alpine
    container_name: moneyshop-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: moneyshop-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # ── Database (Neon PostgreSQL — cloud) ──────────
      DATABASE_URL: "${DATABASE_URL}"

      # ── Auth ────────────────────────────────────────
      AUTH_SECRET: "${NEXTAUTH_SECRET}"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET}"
      NEXTAUTH_URL: "${APP_URL:-http://localhost:3000}"
      AUTH_URL: "${APP_URL:-http://localhost:3000}"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_EXPIRES_IN: "7d"

      # ── App ─────────────────────────────────────────
      APP_URL: "${APP_URL:-http://localhost:3000}"
      NEXT_PUBLIC_APP_URL: "${APP_URL:-http://localhost:3000}"
      NEXT_PUBLIC_APP_NAME: "MoneyShop"
      CORS_ORIGIN: "${APP_URL:-http://localhost:3000}"
      NODE_ENV: "production"
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"

      # ── Redis / WS ──────────────────────────────────
      REDIS_URL: "redis://redis:6379"
      NEXT_PUBLIC_WS_URL: "${WS_URL:-http://localhost:3001}"

      # ── Security ────────────────────────────────────
      CARD_ENCRYPTION_KEY: "${CARD_ENCRYPTION_KEY}"

      # ── SMS (Twilio) ────────────────────────────────
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN}"
      TWILIO_PHONE_NUMBER: "${TWILIO_PHONE_NUMBER}"

      # ── Email ───────────────────────────────────────
      RESEND_API_KEY: "${RESEND_API_KEY}"
      EMAIL_FROM: "${EMAIL_FROM:-noreply@moneyshop.iq}"

      # ── Web Push ────────────────────────────────────
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: "${NEXT_PUBLIC_VAPID_PUBLIC_KEY}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY}"
      VAPID_SUBJECT: "${VAPID_SUBJECT:-mailto:noreply@moneyshop.iq}"

      # ── Auto Update ─────────────────────────────────
      AUTO_UPDATE_ENABLED: "${AUTO_UPDATE_ENABLED:-true}"
      GITHUB_OWNER: "${GITHUB_OWNER}"
      GITHUB_REPO: "${GITHUB_REPO}"
      GITHUB_TOKEN: "${GITHUB_TOKEN}"
    depends_on:
      redis:
        condition: service_healthy

  ws:
    build:
      context: .
      dockerfile: Dockerfile
      target: ws-server
    container_name: moneyshop-ws
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      REDIS_URL: "redis://redis:6379"
      CORS_ORIGIN: "${APP_URL:-http://localhost:3000}"
      WS_PORT: "3001"
      HOSTNAME: "0.0.0.0"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
