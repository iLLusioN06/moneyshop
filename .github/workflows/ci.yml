name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: moneyshop
          POSTGRES_PASSWORD: moneyshop_secret
          POSTGRES_DB: moneyshop
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://moneyshop:moneyshop_secret@localhost:5432/moneyshop

      - name: Run Prisma migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://moneyshop:moneyshop_secret@localhost:5432/moneyshop

      - name: Lint
        run: npm run lint

      - name: Unit Tests
        run: npm test -- --coverage --ci
        env:
          DATABASE_URL: postgresql://moneyshop:moneyshop_secret@localhost:5432/moneyshop
          NEXTAUTH_SECRET: ci-test-secret
          CARD_ENCRYPTION_KEY: ci-test-key-32chars-long!!!!! 

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://moneyshop:moneyshop_secret@localhost:5432/moneyshop
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-test-secret
          CARD_ENCRYPTION_KEY: ci-test-key-32chars-long!!!!!

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: lint-and-build

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: moneyshop
          POSTGRES_PASSWORD: moneyshop_secret
          POSTGRES_DB: moneyshop
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://moneyshop:moneyshop_secret@localhost:5432/moneyshop

      - name: Run Prisma migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://moneyshop:moneyshop_secret@localhost:5432/moneyshop

      - name: Seed database
        run: npx tsx prisma/seed.ts
        env:
          DATABASE_URL: postgresql://moneyshop:moneyshop_secret@localhost:5432/moneyshop

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://moneyshop:moneyshop_secret@localhost:5432/moneyshop
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-test-secret
          CARD_ENCRYPTION_KEY: ci-test-key-32chars-long!!!!!
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: "BNxR1Kp...test"

      - name: Start server
        run: npm start &
        env:
          DATABASE_URL: postgresql://moneyshop:moneyshop_secret@localhost:5432/moneyshop
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-test-secret
          CARD_ENCRYPTION_KEY: ci-test-key-32chars-long!!!!!
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: "BNxR1Kp...test"

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
